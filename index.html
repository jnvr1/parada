<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4fbff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<title>Parada</title>
<style>
/* --u es la unidad de la interfaz (fija); --c es la celda del tablero (se achica cuando el tablero crece);
   --h es la altura de los bloques: el "3D" es una cara frontal hecha con sombra sólida.
   Todo el aspecto sale de variables: acá están los valores por defecto y cada mundo (body.tN) define su material. */
body {
  --n: 6; --u: calc(min(90vw, 43vh) / 6); --c: calc(min(90vw, 43vh) / var(--n)); --h: calc(var(--c) * .16);
  --font: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --panel-r: 14px; --stitch: none;            /* paneles: cartel, botones, fila, parada, tarjeta */
  --rim-r: 22px; --rim-stitch: none;          /* borde del tablero */
  --er: 1.3px; /* --er: radio de los ojos */
}
/* Un mundo cada 15 niveles. Son guiños originales a cosas que le gustan a la jugadora, no copias de los personajes. */
body.t0 { /* Nubecitas — una cafetería en el cielo: toldos a rayas pastel y cielo con nubes. Perritos blancos sobre rollitos de canela glaseados */
  --bg1: #fff6fb; --bg2: #bfe3ff; --ink: #5a5fa0;
  --panel: repeating-linear-gradient(90deg, #fff 0 16px, #ffd9e8 16px 32px); --panel-d: #f0a9c4; --panel-r: 26px; /* toldo */
  --mat: #bfe3ff; --mat-img:
    radial-gradient(ellipse 34% 14% at 30% 32%, #fff 97%, #0000) 0 0 / calc(var(--c) * 3) calc(var(--c) * 3),
    radial-gradient(ellipse 22% 12% at 46% 24%, #fff 97%, #0000) 0 0 / calc(var(--c) * 3) calc(var(--c) * 3),
    radial-gradient(ellipse 30% 12% at 76% 74%, #fffc 97%, #0000) 0 0 / calc(var(--c) * 3) calc(var(--c) * 3); /* nubes */
  --rim: #fff; --rim-d: #f0a9c4; --rim-r: 36px; --rim-stitch: 2px dotted #ffb7d2;
  --skin: #fff; --eye: #5aa7e0; --cheek: #ffb3cf;
}
body.t1 { /* Anochecer — tapa de novela: negro, rojo manzana y blanco; claro de bosque con niebla. Vampiros pálidos en ataúdes forrados de rojo */
  --font: Georgia, "Times New Roman", serif;
  --bg1: #3b2f55; --bg2: #0b0a12; --ink: #fff;
  --panel: linear-gradient(#26222e, #0e0c13); --panel-d: #000; --panel-r: 4px; --stitch: 1px solid #c8102e; /* filete rojo */
  --mat: #1f3a30; --mat-img:
    repeating-linear-gradient(180deg, #0000 0 calc(var(--c) * .7), #ffffff14 calc(var(--c) * .7) var(--c)),
    repeating-linear-gradient(60deg, #0000 0 9px, #0000001f 9px 10px); /* niebla sobre el bosque */
  --rim: #15131a; --rim-d: #000; --rim-r: 6px; --rim-stitch: 2px solid #c8102e;
  --skin: #f6eff2; --eye: #d9a520; --hair: #2b1d1d;
}
body.t2 { /* La arena — acero remachado y fuego. Tributos con trenza sobre cajas de suministros */
  --font: Impact, "Arial Narrow", "Roboto Condensed", sans-serif;
  --bg1: #ffe2b0; --bg2: #e08a3c; --ink: #fff5e0;
  --panel: radial-gradient(circle at 9px 9px, #0006 2px, #0000 3px), radial-gradient(circle at calc(100% - 9px) 9px, #0006 2px, #0000 3px),
    radial-gradient(circle at 9px calc(100% - 9px), #0006 2px, #0000 3px), radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), #0006 2px, #0000 3px),
    linear-gradient(#6a6d75, #4b4e56); /* remaches en las esquinas */
  --panel-d: #2c2e33; --panel-r: 4px;
  --mat: #e6cf9c; --mat-img: radial-gradient(#0000001f 2px, #0000 3px) 0 0 / 9px 9px; /* arena granulada */
  --rim: #4b4e56; --rim-d: #2c2e33; --rim-r: 6px; --rim-stitch: 2px solid #f2a33a; /* línea de fuego */
  --skin: #e9b98a; --eye: #3a2414; --hair: #3a2414;
}
body.t3 { /* Arrecife — arena de playa y agua con olas. Tiburoncitos sobre tablas de surf */
  --bg1: #bdeeff; --bg2: #2f8fc4; --ink: #0d3550;
  --panel: radial-gradient(#00000014 1.5px, #0000 2.5px) 0 0 / 11px 11px, linear-gradient(#f7e7bd, #ecd49c); --panel-d: #c4a973; --panel-r: 20px;
  --mat: #7fcde4; --mat-img: repeating-linear-gradient(0deg, #0000 0 calc(var(--c) * .5 - 2px), #ffffff55 calc(var(--c) * .5 - 2px) calc(var(--c) * .5)), linear-gradient(#bfeaf5, #62bfdd); /* olas */
  --rim: #f2deb0; --rim-d: #c4a973; --rim-r: 32px;
  --skin: #8fa9bf; --face: linear-gradient(#8fa9bf 62%, #f4f8fb 62%); --eye: #10202c;
}
body.t4 { /* El otro lado — tela cosida. Muñecos con ojos de botón sobre carretes de hilo */
  --font: Georgia, "Times New Roman", serif; font-style: italic;
  --bg1: #3a2f66; --bg2: #120f26; --ink: #ffe9f6;
  --panel: repeating-linear-gradient(45deg, #0000 0 3px, #ffffff0d 3px 4px), repeating-linear-gradient(-45deg, #0000 0 3px, #ffffff0d 3px 4px), #4b3f7a; /* trama */
  --panel-d: #2e2552; --panel-r: 10px; --stitch: 2px dashed #ffb3dccc; /* costura */
  --mat: #2a2a4a; --mat-img: conic-gradient(#ffffff0f 25%, #0000 0 50%, #ffffff0f 0 75%, #0000 0) 0 0 / calc(var(--c) * 2) calc(var(--c) * 2); /* colcha a cuadros */
  --rim: #c0508f; --rim-d: #8a3566; --rim-r: 14px; --rim-stitch: 2px dashed #ffd1ea;
  --skin: #f3dcc6; --eye: #111; --er: 2.2px; --hair: #27306b;
}
body.t5 { /* Pasarela — brillantina y animal print. Muñecas glam de melena enorme sobre labiales */
  --font: "Arial Black", Impact, "Arial Narrow", sans-serif;
  --bg1: #ffd6ec; --bg2: #b44ad1; --ink: #fff;
  --panel: radial-gradient(#fff9 1px, #0000 1.6px) 0 0 / 13px 13px, radial-gradient(#fff6 1px, #0000 1.6px) 6px 7px / 17px 17px, linear-gradient(#ff5fb0, #e0338f); /* brillantina */
  --panel-d: #a31d63; --panel-r: 18px; --stitch: 2px solid #ffd76a; /* ribete dorado */
  --mat: #ffc2e2; --mat-img: repeating-linear-gradient(115deg, #0000 0 14px, #7a2a8a2e 14px 20px, #0000 20px 31px, #7a2a8a1f 31px 34px); /* cebra */
  --rim: #8a3fc7; --rim-d: #5a2389; --rim-r: 26px; --rim-stitch: 2px solid #ffd76a;
  --skin: #d9a877; --eye: #3a2a55; --er: 1.8px; --lip: #e0346f; --hair: #3b1f14;
}
body.t6 { /* Clase de monstruos — negro, rosa neón y rombos. Monstruitas de piel verde y mechón rosa sobre lápices */
  --font: Georgia, "Times New Roman", serif;
  --bg1: #3d2a4f; --bg2: #0d0b12; --ink: #ffd9ee;
  --panel: repeating-linear-gradient(45deg, #0000 0 11px, #ff4fa32e 11px 13px), repeating-linear-gradient(-45deg, #0000 0 11px, #46e0d02e 11px 13px), #1a161f; /* rombos */
  --panel-d: #000; --panel-r: 8px; --stitch: 2px dashed #ff4fa3;
  --mat: #221d2b; --mat-img: conic-gradient(#46e0d01f 25%, #0000 0 50%, #ff4fa31f 0 75%, #0000 0) 0 0 / calc(var(--c) * 2) calc(var(--c) * 2); /* damero */
  --rim: #ff4fa3; --rim-d: #a8256a; --rim-r: 10px; --rim-stitch: 2px dashed #15121a;
  --skin: #b6e3c6; --eye: #ff4fa3; --er: 1.8px; --hair: #7b3fb5;
}
body.t7 { /* La manada — franela a cuadros y nieve. Lobitos sobre huesos */
  --bg1: #eaf4fb; --bg2: #7fa3bf; --ink: #fff;
  --panel: repeating-linear-gradient(0deg, #0000 0 10px, #0005 10px 20px), repeating-linear-gradient(90deg, #b3202a 0 10px, #6e1219 10px 20px); /* franela */
  --panel-d: #4a0c11; --panel-r: 8px;
  --mat: #eef6fb; --mat-img: radial-gradient(#b9cfe0 1.5px, #0000 2.5px) 0 0 / 14px 14px; /* nieve */
  --rim: #2f4f3e; --rim-d: #1c3327; --rim-r: 12px;
  --skin: #9aa3ad; --face: radial-gradient(circle at 50% 88%, #e8ecef 0 30%, #9aa3ad 32%); --eye: #e0a21a; --ear: #7d8690;
}
body.t8 { /* Mansión de medianoche — rayas, mármol a cuadros y un filete violeta. Esqueletos de galera sobre llaves antiguas */
  --font: Georgia, "Times New Roman", serif;
  --bg1: #4a4a57; --bg2: #0c0c10; --ink: #fff;
  --panel: repeating-linear-gradient(90deg, #17171c 0 12px, #2a2a33 12px 24px); --panel-d: #000; --panel-r: 2px; --stitch: 1px solid #f2f0ea; /* rayas */
  --mat: #2a2a33; --mat-img: conic-gradient(#e9e6df 25%, #0000 0 50%, #e9e6df 0 75%, #0000 0) 0 0 / calc(var(--c) * 2) calc(var(--c) * 2); /* damero de mármol */
  --rim: #111; --rim-d: #000; --rim-r: 4px; --rim-stitch: 2px solid #b08cff;
  --skin: #f4f1ea; --eye: #111; --er: 2.4px; --lip: #111;
}
body.t9 { /* Dulcería kawaii — menta con lunares y vainilla con granas. Gatitas sobre caramelos envueltos */
  --bg1: #fffbe8; --bg2: #ffc9de; --ink: #a04a78;
  --panel: radial-gradient(#fff 2.5px, #0000 3.5px) 0 0 / 16px 16px, #b8f0dc; --panel-d: #7cc9ae; --panel-r: 22px; /* lunares */
  --mat: #fff3c9; --mat-img: radial-gradient(#ff8fb8 1.5px, #0000 2.5px) 0 0 / 22px 22px, radial-gradient(#7fd3ff 1.5px, #0000 2.5px) 11px 7px / 26px 26px, radial-gradient(#9be28f 1.5px, #0000 2.5px) 5px 15px / 30px 30px; /* granas */
  --rim: #ff9ec4; --rim-d: #d96a98; --rim-r: 30px; --rim-stitch: 3px dotted #fff;
  --skin: #fff; --eye: #222; --cheek: #ffb3cf; --lip: #f7c531; --ear: #fff;
}
body.t10 { /* Sirenas — nácar tornasolado, perlas y escamas. Sirenitas en conchas gigantes */
  --bg1: #d8fff6; --bg2: #7a6fd6; --ink: #3b2f7a;
  --panel: linear-gradient(120deg, #c9f5ff, #e6d4ff 50%, #ffd6ef); --panel-d: #9d8fd6; --panel-r: 24px; --stitch: 2px dotted #fff; /* nácar con perlas */
  --mat: #5fd0c8; --mat-img: radial-gradient(circle at 50% 0, #0000 0 60%, #ffffff40 62% 70%, #0000 72%) 0 0 / calc(var(--c) * .5) calc(var(--c) * .5); /* escamas */
  --rim: #e6d4ff; --rim-d: #9d8fd6; --rim-r: 34px; --rim-stitch: 3px dotted #fff;
  --skin: #f2c9a8; --eye: #3b2f7a; --lip: #ff6fa8; --hair: #19b5a5;
}
body.t11 { /* El Capitolio — oro, mármol y exceso. Pelucas empolvadas sobre ramos de rosas blancas */
  --font: "Bodoni MT", Didot, Georgia, serif;
  --bg1: #fdf3d0; --bg2: #c9358f; --ink: #3a2a00;
  --panel: linear-gradient(120deg, #f7d774, #fff3b8 45%, #d9a520); --panel-d: #9a7310; --panel-r: 2px; --stitch: 3px double #7a5a00; /* oro con moldura */
  --mat: #f6f3ee; --mat-img: repeating-linear-gradient(125deg, #0000 0 22px, #0000000f 22px 23px, #0000 23px 41px, #00000014 41px 42px); /* vetas de mármol */
  --rim: #d9a520; --rim-d: #9a7310; --rim-r: 4px; --rim-stitch: 3px double #fff3b8;
  --skin: #f2d3bd; --eye: #1188aa; --lip: #c9358f; --cheek: #ff9ec4;
}
body.t12 { /* Acuario de medusas — vidrio oscuro y neón. Medusas con halo dentro de burbujas */
  --bg1: #1b2a6b; --bg2: #050818; --ink: #c9f6ff;
  --panel: linear-gradient(#ffffff26, #ffffff0d), #0f1d4a; --panel-d: #050a22; --panel-r: 16px; --stitch: 1px solid #5ff0ff88; /* vidrio con borde neón */
  --mat: #0b1440; --mat-img: radial-gradient(circle, #0000 0 5px, #5ff0ff40 5px 6px, #0000 7px) 0 0 / var(--c) var(--c),
    radial-gradient(circle, #0000 0 3px, #ff7ae040 3px 4px, #0000 5px) calc(var(--c) * .5) calc(var(--c) * .4) / calc(var(--c) * 1.5) calc(var(--c) * 1.5); /* burbujas */
  --rim: #162a7a; --rim-d: #0a1445; --rim-r: 26px; --rim-stitch: 2px solid #5ff0ff;
  --skin: #e6d9ff; --face: linear-gradient(#f3ecff, #cdb8ff); --eye: #3b2f7a;
}
/* Rasgos de los personajes de los mundos 8 a 13 */
.t7 .p::after, .t9 .p::after { left: 8%; width: 84%; height: 34%; bottom: 150%; background: var(--ear); clip-path: polygon(0 100%, 12% 0, 38% 100%, 62% 100%, 88% 0, 100% 100%); } /* orejas en punta */
.t8 .p::after { left: 4%; width: 92%; height: 40%; bottom: 155%; background: #111; clip-path: polygon(22% 0, 78% 0, 78% 78%, 100% 78%, 100% 100%, 0 100%, 0 78%, 22% 78%); } /* galera */
.t10 .p::after { z-index: -1; left: -4%; width: 108%; height: 105%; bottom: 80%; border-radius: 50% 50% 30% 30%; background: var(--hair); } /* pelo largo */
.t11 .p::after { z-index: -1; left: 0; width: 100%; height: 70%; bottom: 135%; border-radius: 50% 50% 40% 40%; background: #fdfdfd; box-shadow: inset -3px -3px 0 #0001; } /* peluca alta */
.t12 .p::before { border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%; } /* campana */
.t12 .p::after { z-index: -1; left: -8%; width: 116%; aspect-ratio: 1; bottom: 76%; border-radius: 50%; background: #5ff0ff55; } /* halo */
.boss #board { border-color: #f2c14e; box-shadow: 0 10px 0 #b98a1d, 0 0 34px #f2c14eaa, inset 0 4px 6px #0003; } /* nivel desafío */

/* Decorado: emojis del mundo flotando en el fondo (posiciones distintas en cada nivel) y su emblema como marca de agua del tablero */
#deco { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#deco div { position: absolute; opacity: .6; font-style: normal; animation: float 5s ease-in-out infinite alternate; }
#board::before { content: var(--mark); position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--c) * var(--n) * .55); font-style: normal; opacity: .16; pointer-events: none; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 2vh;
  padding: max(2vh, env(safe-area-inset-top)) 0 4vh;
  background: radial-gradient(circle at 50% 0, var(--bg1), var(--bg2)) fixed; color: var(--ink);
  font-weight: 700; font-size: 16px; font-family: var(--font);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
header, #queue, #dock { width: calc(var(--u) * 6 + 16px); }
header { display: flex; justify-content: space-between; align-items: center; }

/* Paneles: cartel de nivel, botones, fila, parada y tarjeta; el material lo pone el mundo */
#lvl, button, #queue, #dock, #card {
  background: var(--panel); border-radius: var(--panel-r); outline: var(--stitch); outline-offset: -5px;
  box-shadow: 0 5px 0 var(--panel-d), 0 9px 10px #0003, inset 0 2px 0 #fff4;
}
#lvl { padding: .4em 1em; }
button { font: inherit; color: var(--ink); border: 0; padding: .45em .9em; }
button:active { translate: 0 3px; box-shadow: 0 2px 0 var(--panel-d), inset 0 2px 0 #fff4; }

/* Fila de pasajeros: el del frente (izquierda) es el que sube */
#queue { height: calc(var(--u) * 1.3); padding: 0 12px 7px; display: flex; align-items: flex-end; gap: 6px; overflow: hidden; font-size: .8em; }
.p {
  flex: none; position: relative; isolation: isolate; width: calc(var(--u) * .4); height: calc(var(--u) * .4); border-radius: 40% 40% 22% 22%;
  background: linear-gradient(90deg, #fff4, #0000 45%, #0003), var(--k); box-shadow: 0 2px 0 #0003;
  display: grid; place-items: center; font-size: calc(var(--u) * .18); font-style: normal; color: #fff;
}
.p::before { /* cabeza con ojos */
  content: ''; position: absolute; bottom: 85%; left: 10%; width: 80%; aspect-ratio: 1; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 60%, var(--eye) 0 var(--er), #0000 calc(var(--er) + .6px)),
    radial-gradient(circle at 68% 60%, var(--eye) 0 var(--er), #0000 calc(var(--er) + .6px)),
    radial-gradient(circle at 16% 78%, var(--cheek, #0000) 0 1.6px, #0000 2.3px),
    radial-gradient(circle at 84% 78%, var(--cheek, #0000) 0 1.6px, #0000 2.3px),
    radial-gradient(ellipse 22% 11% at 50% 85%, var(--lip, #0000) 96%, #0000), /* labios, solo si el mundo define --lip */
    var(--face, var(--skin));
  box-shadow: inset -2px -2px 0 #0002;
}
.p::after { content: ''; position: absolute; } /* el rasgo de cada mundo */
.t0 .p::after { z-index: -1; left: -12%; width: 124%; height: 42%; bottom: 100%; border-radius: 40% 40% 50% 50%; background: #fff; box-shadow: inset 0 -2px 0 #0001; } /* orejas caídas */
.t5 .p::before { left: 2%; width: 96%; } /* cabezota */
.t5 .p::after { z-index: -1; left: -10%; width: 120%; height: 115%; bottom: 80%; border-radius: 50% 50% 35% 35%; background: var(--hair); } /* melena enorme por detrás */
.t6 .p::after { background: linear-gradient(90deg, #7b3fb5 55%, #ff4fa3 55% 75%, #7b3fb5 75%) !important; } /* mechón rosa */
.t1 .p::after, .t2 .p::after, .t6 .p::after { left: 8%; width: 84%; height: 44%; bottom: 122%; border-radius: 50% 50% 12% 12% / 90% 90% 10% 10%; background: var(--hair); } /* pelo */
.t2 .p::after { box-shadow: calc(var(--u) * .13) calc(var(--u) * .14) 0 calc(var(--u) * -.045) var(--hair); } /* trenza al costado */
.t3 .p::after { left: 38%; width: 36%; height: 34%; bottom: 158%; background: #7d98af; clip-path: polygon(20% 0, 100% 100%, 0 100%); } /* aleta */
.t4 .p::after { left: 4%; width: 92%; height: 68%; bottom: 100%; border: solid var(--hair); border-width: calc(var(--u) * .1) calc(var(--u) * .045) 0; border-radius: 50% 50% 20% 20%; } /* melena */
#queue.adv .p { animation: shift .18s ease-out; }
#queue .p:first-child { scale: 1.25; margin: 0 7px 3px 4px; animation: hop .5s infinite alternate ease-in-out; }
.more { margin-left: auto; align-self: center; opacity: .7; }
.fly { position: fixed; z-index: 60; transform-origin: 0 0; pointer-events: none; } /* pasajero yendo a su asiento */

/* Parada: huecos; cada vehículo muestra sus asientos y las cabecitas que ya subieron */
#dock, .ghost { --h: calc(var(--u) * .16); }
#dock { display: grid; grid-template-columns: repeat(var(--docks, 4), 1fr); gap: 8px; padding: 8px 8px calc(8px + var(--h) * .6); }
.slot { height: calc(var(--u) * 1.3); border-radius: 12px; background: #0000001f; box-shadow: inset 0 3px 5px #0004, inset 0 -1px 0 #fff3; }
.slot.full {
  position: relative; isolation: isolate; background: none; box-shadow: none;
  filter: drop-shadow(0 var(--h) 0 var(--kd)); translate: 0 calc(var(--h) * -.6);
  display: grid; grid-template-columns: repeat(var(--cols), auto); place-content: center; gap: 4px;
}
.slot.full .art { inset: 0; width: auto; height: auto; transform: none; z-index: -1; } /* el mismo objeto, de fondo */
.slot.arrive { animation: land .01s var(--wait) backwards; } /* --wait lo pone el JS: aparece justo cuando aterriza la pieza */
.slot.arrive .seat { animation: pop .25s calc(var(--wait) + 30ms) backwards; }
.travel { position: fixed; z-index: 40; pointer-events: none; filter: drop-shadow(0 var(--h) 0 var(--kd)) drop-shadow(0 8px 8px #0005); } /* pieza en viaje del tablero a la parada */
.spin { position: absolute; inset: 0; } /* gira la pieza hasta acostarla; la sombra queda en .travel para que siempre caiga hacia abajo */
.ping { position: fixed; z-index: 49; width: 10px; height: 10px; margin: -5px; border-radius: 50%; border: 3px solid var(--k); pointer-events: none; animation: ping .5s ease-out forwards; }
.ghost { position: fixed; z-index: 50; margin: 0; translate: none !important; pointer-events: none; transition: transform .5s .25s cubic-bezier(.6, -.3, .9, .6); } /* vehículo lleno que se va */
.seat {
  width: calc(var(--u) * .21); aspect-ratio: 1; border-radius: 50%; background: var(--kd); box-shadow: inset 0 2px 2px #0005;
  color: #fff9; font-size: calc(var(--u) * .11); font-style: normal; line-height: 1; display: grid; place-items: center;
}
.seat.on { background: radial-gradient(circle at 35% 30%, #fff7, #0000 60%), var(--skin); box-shadow: 0 2px 0 #0004; color: #0000; }
.seat.pop { animation: pop .2s .22s backwards; } /* espera a que llegue el pasajero */

/* Estacionamiento: bandeja inclinada en perspectiva; superficie y borde los pone el mundo */
#stage { perspective: 900px; }
#board {
  box-sizing: content-box; position: relative; width: calc(var(--c) * var(--n)); height: calc(var(--c) * var(--n));
  background: var(--mat-img), var(--mat);
  border: 8px solid var(--rim); border-radius: var(--rim-r); outline: var(--rim-stitch); outline-offset: -6px;
  box-shadow: 0 10px 0 var(--rim-d), 0 20px 18px #0004, inset 0 4px 6px #0003;
  overflow: hidden; transform: rotateX(18deg); transform-origin: 50% 100%;
}
/* Cada pieza es un dibujo SVG del objeto del mundo (ART en el JS), pintado con el color del pasajero (--k).

.v.bump { animation: bump .22s; } /* bloqueado: amaga a salir y vuelve */

}
.art { position: absolute; left: 50%; top: calc(50% - var(--h) / 2); width: var(--len); height: var(--thick); transform: translate(-50%, -50%) rotate(var(--rot)); }

.art .d { fill: var(--kd); }
.art .o { fill: var(--kd); stroke: var(--kd); stroke-width: 6; stroke-linejoin: round; }
.art .f { fill: var(--k); }
.art .w { fill: #fff; }
.art .wl { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: .85; } /* trazo claro */
.art .dl { fill: none; stroke: var(--kd); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; } /* trazo oscuro */
.v:active .bus { translate: 0 3px; }
.roof { position: absolute; inset: 0 0 var(--h); display: grid; place-items: center; pointer-events: none; }
.tag { display: flex; align-items: center; gap: calc(var(--c) * .05); padding: .12em .3em; border-radius: 999px; background: #00000059; color: #fff; font: 700 calc(var(--c) * .3)/1 system-ui, sans-serif; } /* flecha + símbolo */

.tile::before { content: ''; position: absolute; z-index: -1; inset: 3px 3px calc(var(--h) + 3px); }

.tile.gate::before { display: none; }
.tile.gate { padding: 0; font-size: calc(var(--c) * .26); }

.br svg { display: block; width: 100%; height: 100%; overflow: visible; rotate: var(--rot); }
.leaf { transform-box: fill-box; transition: transform .35s ease-in; }
.leaf.l { transform-origin: left center; }
.leaf.r { transform-origin: right center; }
.gone .leaf { transform: scaleX(1.27); } /* las hojas bajan y se juntan en el medio */
.med, .tile.gate .lbl { transition: opacity .15s; }
.gone .med, .tile.gate.gone .lbl { opacity: 0; }
.tile.gate.gone { animation: fade .3s .6s forwards; }
.tile.count::before { border-radius: 50%; background: #2b2b33; box-shadow: 0 var(--h) 0 #111, 0 calc(var(--h) + 3px) 4px #0006, inset 0 0 0 3px var(--rim); } /* bloque con número: redondo y oscuro */
.tile.tick { animation: pop .25s; }
.tile.gone { animation: gone .4s forwards; }

.mystery .bus { filter: grayscale(1) brightness(1.1) drop-shadow(0 var(--h) 0 #777) drop-shadow(0 3px 3px #0006); }
.reveal .bus { animation: pop .3s; }
#tip { min-height: 1.3em; max-width: 90vw; text-align: center; font-size: .9em; }
.shake { animation: shake .25s; }
@keyframes shake { 25% { translate: -5px } 75% { translate: 5px } }
@keyframes bump { 40% { translate: calc(var(--dx) * 7px) calc(var(--dy) * 7px) } }
@keyframes float { to { translate: 0 14px } }

#banner { position: fixed; inset: 0; z-index: 90; display: grid; place-content: center; text-align: center; white-space: pre-line; font-size: 2em; line-height: 1.4; color: #fff; text-shadow: 0 3px 0 #0008; background: #000a; opacity: 0; pointer-events: none; }

let SYM, W, TI; // símbolos y mundo del nivel actual
// Dibujos de las piezas, uno por mundo (mismo orden que WORLDS). Cada función recibe el largo en celdas (L) y el ancho
// del lienzo (W = 100 × L, alto 100) y devuelve SVG acostado, con el frente a la derecha. Clases: ver .art en el CSS.
const union = f => f("o") + f("f"); // varias formas con un solo contorno: primero todas en oscuro y gruesas, después el relleno
const each = (L, f) => Array.from({ length: L }, (_, i) => f(50 + 100 * i)).join('');
const ART = [
  // rollitos de canela: uno por celda, con su espiral de glaseado
  L => each(L, x => `<circle class="k" cx="${x}" cy="50" r="45"/><path class="wl" d="M${x} 50a6 6 0 0 1 12 0a12 12 0 0 1-24 0a18 18 0 0 1 36 0a24 24 0 0 1-48 0a30 30 0 0 1 60 0"/>`),

  (L, W) => `<rect class="k" x="4" y="8" width="${W - 8}" height="84" rx="5"/>` + each(L, x => `<rect class="dl" x="${x - 42}" y="14" width="84" height="72"/><path class="dl" d="M${x - 38} 18L${x + 38} 82M${x - 38} 82L${x + 38} 18"/>`),

  (L, W) => `<rect x="4" y="22" width="${W * .3}" height="56" rx="6" fill="#f3c64e" stroke="#a8842a" stroke-width="3"/><rect x="${W * .3 + 4}" y="27" width="${W * .1}" height="46" fill="#fff6d8" stroke="#a8842a" stroke-width="3"/><polygon class="k" points="${W * .4 + 4},30 ${W - 40},30 ${W - 6},64 ${W - 6},70 ${W * .4 + 4},70"/><path class="wl" d="M${W * .4 + 14} 39H${W - 52}"/>`,

function art(L, color, fit) { // dibujo del objeto del mundo actual, de L celdas de largo; fit: sin deformar (parada)

const TRAVEL = CALM ? 0 : 750, FLY = CALM ? 0 : 260; // ms: viaje del vehículo a la parada y salto del pasajero
let bannerFor = 0;
const TIPS = { // se muestran la primera vez que aparece cada mecánica
  4: 'Puente levadizo: baja cuando sale una pieza del color de su medallón.',

let level = 1, L, s, over, busy;
try { level = +localStorage.level || 1; } catch {}
level = Math.floor(+new URLSearchParams(location.search).get('nivel')) || level; // ?nivel=46 salta a ese nivel

function chip(cls, color, text = '') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  if (color != null) { el.style.setProperty('--k', COLORS[color]); el.style.setProperty('--kd', DARK[color]); }

}

// La jugada en curso se guarda en el teléfono después de cada movimiento, para retomarla al volver a abrir el juego.
// sig evita restaurar una jugada sobre un tablero distinto (otro nivel, o el mismo número tras una actualización).
const sig = () => L.lot.map(v => '' + v.x + v.y + v.dir + v.len + v.color).join('') + L.queue.join('');
function save() {
  try {
    localStorage.game = JSON.stringify({
      sig: sig(), queue: s.queue, tiles: [...s.tiles],
      lot: s.lot.map(v => L.lot.indexOf(v)), dock: s.dock.map(v => v && [L.lot.indexOf(v), v.filled]),
    });
  } catch {}

function restore() {
  try {
    const g = JSON.parse(localStorage.game);
    if (g.sig !== sig() || g.dock.length !== L.docks) return;
    s.lot = g.lot.map(i => L.lot[i]);
    s.dock = g.dock.map(d => d && Object.assign(L.lot[d[0]], { filled: d[1] }));

    s.tiles = new Map(g.tiles);
  } catch {} // sin jugada guardada, o ilegible: se empieza el nivel de cero

function start(resume) { // resume: retomar la jugada guardada (solo al abrir el juego)
  L = makeLevel(level);
  s = newState(L);
  if (resume === true) restore(); else forget();
  over = false;
  $('msg').hidden = true;
  document.querySelectorAll('.confetti, .fly, .ghost, .ping, .travel').forEach(el => el.remove());
  const t = L.world % WORLDS.length, r = rng(level);
  W = WORLDS[TI = t];
  SYM = W.sym.map(c => c + T);
  document.body.className = 't' + t + (L.boss ? ' boss' : '');
  document.body.style.setProperty('--n', L.n);
  document.body.style.setProperty('--mark', JSON.stringify(W.icon));
  $('deco').replaceChildren(...Array.from({ length: 12 }, (_, i) => {
    const el = chip('', null, W.deco[i % W.deco.length]);
    el.style.cssText = `left:${r() * 92 | 0}vw;top:${r() * 94 | 0}vh;font-size:${22 + r() * 26 | 0}px;rotate:${(r() * 40 | 0) - 20}deg;animation-delay:${-r() * 5}s`;
    return el;
  }));
  $('dock').style.setProperty('--docks', L.docks);
  $('lvl').textContent = `${L.boss ? '⭐' : W.icon} Nivel ${level} · ${W.name}`;
  if ((level - 1) % WORLD_LEN === 0 && bannerFor !== level) { // cartel de bienvenida al entrar a un mundo
    bannerFor = level;
    $('banner').textContent = `${W.icon}\nMundo ${L.world + 1}\n${W.name}`;
    replay($('banner'), 'show');
  }
  $('tip').textContent = TIPS[level] || '';
  $('board').replaceChildren(...s.lot.map((v, i) => {
    const h = v.dir % 2, el = chip('v'), bus = chip('bus', v.color), roof = chip('roof');
    el.style.left = `calc(var(--c) * ${v.x})`;
    el.style.top = `calc(var(--c) * ${v.y})`;
    el.style.width = `calc(var(--c) * ${h ? v.len : 1})`;
    el.style.height = `calc(var(--c) * ${h ? 1 : v.len})`;
    el.style.zIndex = v.y + (h ? 1 : v.len); // los de más abajo tapan a los de arriba
    el.style.setProperty('--i', i);
    el.style.setProperty('--dx', DX[v.dir]);
    el.style.setProperty('--dy', DY[v.dir]);
    const pic = art(v.len, v.color), tag = chip('tag');
    // la pieza deja libre --h abajo de su celda para la cara frontal
    pic.style.setProperty('--len', h ? `calc(var(--c) * ${v.len} - 4px)` : `calc(var(--c) * ${v.len} - var(--h) - 4px)`);
    pic.style.setProperty('--thick', h ? 'calc(var(--c) - var(--h) - 4px)' : 'calc(var(--c) - 4px)');
    pic.style.setProperty('--rot', [270, 0, 90, 180][v.dir] + 'deg');
    tag.style.flexDirection = FLEX[v.dir];
    v.sym = chip('', null, v.hidden ? '?' : SYM[v.color]);
    if (v.hidden) el.classList.add('mystery');
    tag.append(chip('', null, ARROW[v.dir]), v.sym);
    roof.append(tag);
    bus.append(pic, roof);
    el.append(bus);
    el.onclick = () => tap(v, el);
    v.el = el;
    return el;
  }));
  tileEls = new Map();
  drawTiles();
  render();
}

// Puente levadizo visto desde arriba, con el paso de izquierda a derecha: foso, dos hojas levantadas (por eso se ven
// cortas), los estribos de piedra y el medallón donde va el símbolo. Se gira 90° si el camino que corta es vertical.
const LEAF = 'style="fill:#c49a5c;stroke:#7a5a2e;stroke-width:3;stroke-linejoin:round"', PLANK = 'style="fill:none;stroke:#7a5a2e;stroke-width:2.5"', STONE = 'style="fill:var(--rim);stroke:var(--rim-d);stroke-width:3"';
const BRIDGE = `<div class="br"><svg viewBox="0 0 100 100">
  <rect x="10" y="24" width="80" height="52" rx="4" fill="#0008"/>
  <g class="leaf l"><polygon points="12,26 42,31 42,69 12,74" ${LEAF}/><path d="M22 28V72M32 30V70" ${PLANK}/></g>
  <g class="leaf r"><polygon points="88,26 58,31 58,69 88,74" ${LEAF}/><path d="M78 28V72M68 30V70" ${PLANK}/></g>
  <rect x="0" y="16" width="14" height="68" rx="4" ${STONE}/><rect x="86" y="16" width="14" height="68" rx="4" ${STONE}/>
  <circle class="med" cx="50" cy="50" r="14" style="fill:var(--k);stroke:#fff;stroke-width:3.5"/>
</svg></div>`;
let tileEls; // 'x,y' -> elemento del obstáculo
function drawTiles() { // crea, actualiza o retira puentes y bloques según el estado
  for (const [k, el] of tileEls) if (!s.tiles.has(k)) { // se abrió
    tileEls.delete(k);
    el.classList.add('gone');
    setTimeout(() => el.remove(), 900);
  }
  for (const [k, o] of s.tiles) {
    let el = tileEls.get(k);
    if (!el) {
      const [x, y] = k.split(',');
      el = chip('tile ' + o.t, o.t === 'gate' ? o.color : null);
      el.style.left = `calc(var(--c) * ${x})`;
      el.style.top = `calc(var(--c) * ${y})`;
      el.style.zIndex = +y + 1;
      if (o.t === 'gate') { // el puente se alinea con el camino que corta
        el.innerHTML = BRIDGE;
        el.style.setProperty('--rot', L.lot.find(v => path(v, s.n).includes(k)).dir % 2 ? '0deg' : '90deg');
      }
      el.append(chip('lbl'));
      $('board').append(el);
      tileEls.set(k, el);
    }
    const lbl = el.lastChild, text = o.t === 'gate' ? SYM[o.color] : String(o.n);
    if (lbl.textContent !== text) { // el número bajó
      if (lbl.textContent) replay(el, 'tick');
      lbl.textContent = text;
    }
  }
}

// boarded: vehículo al que acaba de subir alguien
function render(boarded) {
  $('queue').className = boarded ? 'adv' : ''; // la fila da un paso adelante
  $('queue').replaceChildren(
    ...s.queue.slice(0, 9).map(c => chip('p', c, SYM[c])),
    s.queue.length > 9 ? chip('more', null, '+' + (s.queue.length - 9)) : '');
  $('dock').replaceChildren(...s.dock.map(v => {
    if (!v) return chip('slot');
    const wait = (v.arriveAt || 0) - performance.now(); // sigue oculto hasta que llega
    const el = chip('slot full' + (wait > 0 ? ' arrive' : ''), v.color);
    if (wait > 0) el.style.setProperty('--wait', wait + 'ms');
    el.style.setProperty('--cols', v.cap / 2);
    el.append(art(v.len, v.color, true), ...Array.from({ length: v.cap }, (_, j) =>
      chip('seat' + (j < v.filled ? ' on' : '') + (v === boarded && j === v.filled - 1 ? ' pop' : ''), null, SYM[v.color])));
    return el;
  }));
}

function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function reveal() { // destapa las piezas sorpresa que quedaron libres
  for (const v of s.lot) if (v.hidden && canExit(v, s.lot, s.n, s.tiles)) {
    v.hidden = false;
    v.sym.textContent = SYM[v.color];
    v.el.classList.replace('mystery', 'reveal');
  }
}

function tap(v, el) {
  if (over) return;
  if (!exit(s, v)) {
    if (canExit(v, s.lot, s.n, s.tiles)) replay($('dock'), 'shake'); // tiene salida pero la parada está llena
    else replay(el, 'bump');
    return;
  }
  const pic = el.querySelector('.art'), from = el.getBoundingClientRect(), thick = pic.offsetHeight;
  el.remove();
  v.arriveAt = performance.now() + TRAVEL; // hasta entonces su lugar en la parada se ve vacío y nadie sube
  render();
  save();
  drive(pic, from, thick, v);
  drawTiles();
  reveal();
  pump();
}

// La pieza despega hacia su lado de salida y planea en una sola curva hasta su lugar, girando hasta quedar acostada
// y achicándose al tamaño exacto con que se dibuja en la parada: al aterrizar no cambia de forma.
function drive(pic, a, thick, v) {
  const g = chip('travel', v.color), spin = chip('spin'), board = $('board').getBoundingClientRect();
  const b = $('dock').children[s.dock.indexOf(v)].getBoundingClientRect();
  const out = [a.bottom - board.top, board.right - a.left, board.bottom - a.top, a.right - board.left][v.dir] + 30;
  const cx = DX[v.dir] * out, cy = DY[v.dir] * out;                                   // punto de control: su salida
  const ex = b.left + b.width / 2 - a.left - a.width / 2, ey = b.top + b.height / 2 - a.top - a.height / 2;
  const k = Math.min(b.height, b.width / v.len) / thick;                               // grosor en la parada / grosor en el tablero
  const frames = Array.from({ length: 17 }, (_, i) => {
    const t = i / 16, u = 1 - t, lift = 1 + .1 * Math.sin(Math.PI * t);
    return { transform: `translate(${2 * u * t * cx + t * t * ex}px, ${2 * u * t * cy + t * t * ey}px) scale(${(1 + (k - 1) * t) * lift})` };
  });
  const timing = { duration: TRAVEL, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' };
  Object.assign(g.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
  spin.append(pic);
  g.append(spin);
  document.body.append(g);
  g.animate(frames, timing);
  spin.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${[90, 0, -90, 180][v.dir]}deg)` }], timing);
  setTimeout(() => g.remove(), TRAVEL);
}

function fly(color, a, b) { // pasajero que se desliza de la fila a su asiento
  const el = chip('p fly', color, SYM[color]), dx = b.left - a.left, dy = b.top - a.top;
  el.style.left = a.left + 'px';
  el.style.top = a.top + 'px';
  document.body.append(el);
  el.animate([
    { transform: 'none' },
    { transform: `translate(${dx / 2}px, ${dy / 2 - 10}px) scale(.85)` },
    { transform: `translate(${dx}px, ${dy}px) scale(.55)` },
  ], { duration: FLY, easing: 'cubic-bezier(.4, 0, .2, 1)' });
  setTimeout(() => el.remove(), FLY);
}

function depart(slot, color) { // copia del vehículo lleno: destello, y se va por la derecha
  const r = slot.getBoundingClientRect(), g = slot.cloneNode(true), ping = chip('ping', color);
  g.className = 'slot full ghost';
  g.querySelectorAll('.seat').forEach(el => el.className = 'seat on');
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  ping.style.left = r.left + r.width / 2 + 'px';
  ping.style.top = r.top + r.height / 2 + 'px';
  document.body.append(g, ping);
  nextFrame(() => g.style.transform = 'translateX(110vw)');
  setTimeout(() => { g.remove(); ping.remove(); }, 900);
}

function pump() { // sube pasajeros de a uno
  if (busy) return;
  busy = true;
  (function step() {
    const next = s.dock.find(v => v && v.color === s.queue[0]);
    if (next && next.arriveAt > performance.now()) return setTimeout(step, 60); // su vehículo todavía viene en camino
    const from = $('queue').firstElementChild, color = s.queue[0], b = boardNext(s);
    if (!b) {
      busy = false;
      if (won(s) || lost(s)) {
        over = true;
        const cur = s, win = won(s);
        forget();
        if (win) try { localStorage.level = level + 1; } catch {} // ya cuenta como ganado aunque cierren antes del cartel
        else replay($('dock'), 'shake');
        setTimeout(() => cur === s && end(win), 800);
      }
      return;
    }
    const slot = $('dock').children[b.slot];
    fly(color, from.getBoundingClientRect(), slot.querySelectorAll('.seat')[b.v.filled - 1].getBoundingClientRect());
    if (b.v.filled === b.v.cap) depart(slot, b.v.color);
    render(b.v);
    save();
    setTimeout(step, 230);
  })();
}

function end(win) {
  if (win) {
    level++;
    try { localStorage.level = level; } catch {}
    for (let i = 0; i < 24; i++) {
      const c = chip('confetti', i % COLORS.length);
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDelay = Math.random() * .4 + 's';
      $('msg').append(c);
    }
  }
  // W sigue siendo el mundo del nivel recién jugado: start() lo cambia recién al tocar el botón
  $('msgIcon').textContent = win ? W.icon : '🚧';
  $('msgText').textContent = win ? W.win[level % W.win.length] : W.lose;
  $('msgNote').textContent = win ? DEDICATORIA : '';
  $('msgBtn').textContent = win ? 'Siguiente' : 'Reintentar';
  $('msg').hidden = false;
}

$('msgBtn').onclick = $('restart').onclick = () => start();
start(true);
pump(); // si la jugada retomada quedó con pasajeros a medio subir, siguen subiendo
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
